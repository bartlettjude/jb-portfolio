name: Sync Projects

on:
  schedule:
    - cron: "0 17 * * *" # 12:00 PM EST (UTC-5)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run sync:projects
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_LOGIN: bartlettjude
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/sync-projects
          commit-message: "chore: sync projects from GitHub"
          title: "Sync projects from GitHub"
          body: "Auto-updated projects from pinned repositories."

